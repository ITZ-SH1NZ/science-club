<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EXECOM Typography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #020826;
            overflow: hidden;
        }

        .logo {
            position: relative;

            font-family: 'Anton', sans-serif;
            font-size: 10rem;

            color: #d63a2f;

            text-transform: uppercase;

            letter-spacing: -8px;

            font-style: italic;

            transform: skewX(-10deg);

            line-height: 1;

            user-select: none;
        }

        .logo::after {
            content: "";

            position: absolute;

            left: 2%;
            bottom: -28px;

            width: 96%;
            height: 10px;

            background: #d63a2f;

            border-radius: 100px;

            transform: rotate(-1deg) skewX(25deg);
        }

        .logo::before {
            content: "";

            position: absolute;

            left: 42%;
            bottom: -42px;

            width: 120px;
            height: 8px;

            background: #d63a2f;

            border-radius: 100px;

            transform: rotate(8deg);
        }
    </style>
</head>

<body>

    <h1 class="logo">EXECOM</h1>

</body>

</html>
